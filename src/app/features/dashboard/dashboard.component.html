<div class="dashboard-content">
  @if (store.loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="48" />
      <p>Chargement des données...</p>
    </div>
  } @else if (store.error()) {
    <div class="error-state">
      <mat-icon>error_outline</mat-icon>
      <p>{{ store.error() }}</p>
      <button mat-flat-button color="primary" (click)="onRefresh()">Réessayer</button>
    </div>
  } @else {
    <div class="dashboard-header">
      <div class="header-left">
        <h2>Vue d'ensemble</h2>
      </div>
      <div class="header-actions">
        <mat-button-toggle-group [value]="activePeriod()" hideSingleSelectionIndicator class="period-toggle">
          @for (period of periods; track period.label) {
            <mat-button-toggle [value]="period.label" (change)="onPeriodChange(period.label, period.days)">
              {{ period.label }}
            </mat-button-toggle>
          }
        </mat-button-toggle-group>

        <mat-form-field appearance="outline" class="event-filter">
          <mat-label>Événement</mat-label>
          <mat-select [value]="store.selectedEventSlug() ?? ''" (selectionChange)="onEventFilter($event.value)">
            <mat-option value="">Tous</mat-option>
            @for (event of store.events(); track event.slug) {
              <mat-option [value]="event.slug">{{ event.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <button mat-icon-button (click)="onRefresh()" matTooltip="Actualiser" class="refresh-btn">
          <mat-icon>refresh</mat-icon>
        </button>
        <app-notification-center />
      </div>
    </div>

    <app-kpi-cards [stats]="store.stats()" />

    <div class="charts-row">
      <div class="chart-main">
        <app-clicks-chart [timeline]="store.timeline()" [eventTimeline]="store.eventTimeline()" />
      </div>
      <div class="chart-side">
        <app-device-breakdown [devices]="store.deviceBreakdown()" />
      </div>
    </div>

    <div class="tables-row">
      <div class="table-main">
        <app-events-list [events]="store.events()" (viewDetail)="onViewEvent($event)" />
      </div>
      <div class="table-side">
        <app-utm-table [sources]="store.utmBreakdown()" />
      </div>
    </div>
  }
</div>
