<div class="auth-container">
  <mat-card class="auth-card">
    <div class="card-content">
      <!-- ═══ Formulaire ═══ -->
      <div class="form-section">
        <div class="form-content">
          <div class="brand-row">
            <img src="/hm_dev_logo.png" alt="HM-Events" class="brand-row-logo" />
            <span class="brand-row-name">HM Events</span>
          </div>
          <h2 class="title">Connexion</h2>
          <p class="subtitle">Connectez-vous pour accéder au dashboard</p>

          <form class="auth-form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Email</mat-label>
              <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
              <mat-icon matPrefix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Mot de passe</mat-label>
              <input matInput [type]="hidePassword() ? 'password' : 'text'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required />
              <mat-icon matPrefix>lock</mat-icon>
              <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())"
                      [attr.aria-label]="'Afficher le mot de passe'">
                <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <button mat-raised-button type="submit" class="create-btn" [disabled]="store.loading() || !email() || !password()">
              @if (store.loading()) {
                <mat-spinner diameter="20" class="btn-spinner" />
              } @else {
                <span>Se connecter</span>
              }
            </button>

            @if (store.error()) {
              <div class="error-message">{{ store.error() }}</div>
            }
          </form>

          <div class="remember-forgot">
            <a routerLink="/forgot-password" class="forgot-password-link">Mot de passe oublié ?</a>
          </div>

          <div class="login-link">
            <span>Pas encore de compte ? </span>
            <a routerLink="/register" class="login-text">Créer un compte</a>
          </div>
        </div>
      </div>

      <!-- ═══ Panneau visuel ═══ -->
      <div class="right-side-section brand-panel">
        <div class="brand-panel-inner">
          <img src="/hm_dev_logo.png" alt="HM-Events" class="brand-panel-logo" />
          <h3>HM Events App</h3>
          <p>Événements · Billetterie · Management</p>
        </div>
      </div>
    </div>
  </mat-card>
</div>
