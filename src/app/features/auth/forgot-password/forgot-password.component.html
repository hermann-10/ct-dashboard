<div class="forgot-wrapper">
  <mat-card class="forgot-card">
    <mat-card-header>
      <mat-card-title>
        <img src="/hm_dev_logo.png" alt="HM-Events" class="forgot-logo" />
        Mot de passe oublié
      </mat-card-title>
      <mat-card-subtitle>Entrez votre email pour recevoir un lien de réinitialisation</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (store.error()) {
        <div class="error-banner">
          <mat-icon>error_outline</mat-icon>
          {{ store.error() }}
        </div>
      }

      @if (store.successMessage()) {
        <div class="success-banner">
          <mat-icon>check_circle_outline</mat-icon>
          {{ store.successMessage() }}
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
            <mat-icon matPrefix>email</mat-icon>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" class="full-width submit-btn" [disabled]="store.loading() || !email()">
            @if (store.loading()) {
              <mat-spinner diameter="20" />
            } @else {
              Envoyer le lien
            }
          </button>
        </form>
      }

      <div class="auth-links">
        <a routerLink="/login" class="auth-link">
          <mat-icon>arrow_back</mat-icon>
          Retour à la connexion
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
