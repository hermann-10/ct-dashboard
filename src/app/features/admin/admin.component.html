<div class="admin-layout">
  <mat-toolbar color="primary" class="admin-toolbar">
    <button mat-icon-button (click)="onToggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <img src="/hm_dev_logo.png" alt="HM-Events" class="toolbar-logo" />
    <span class="toolbar-title">HM Events App</span>
    <span class="spacer"></span>
    <span class="user-email">{{ displayName() || userEmail()?.email }}</span>
    <button mat-icon-button (click)="onLogout()" matTooltip="Déconnexion">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav [opened]="sidenavOpened()" mode="side" class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/admin/traffic" routerLinkActive="active-link">
          <mat-icon matListItemIcon>insights</mat-icon>
          <span matListItemTitle>Traffic</span>
        </a>
        <a mat-list-item routerLink="/admin/events" routerLinkActive="active-link">
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle>Événements</span>
        </a>
        <a mat-list-item routerLink="/admin/artists" routerLinkActive="active-link">
          <mat-icon matListItemIcon>album</mat-icon>
          <span matListItemTitle>Artistes</span>
        </a>
        <a mat-list-item routerLink="/admin/bar" routerLinkActive="active-link">
          <mat-icon matListItemIcon>local_bar</mat-icon>
          <span matListItemTitle>Bar / Produits</span>
        </a>
        <a mat-list-item routerLink="/admin/newsletter" routerLinkActive="active-link">
          <mat-icon matListItemIcon>mail_outline</mat-icon>
          <span matListItemTitle>Newsletter</span>
        </a>
        <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Utilisateurs</span>
        </a>
        <a mat-list-item routerLink="/admin/settings" routerLinkActive="active-link">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Paramètres</span>
        </a>
      </mat-nav-list>

      <div class="sidenav-footer">
        <a mat-list-item routerLink="/" class="home-link">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Voir le site</span>
        </a>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
