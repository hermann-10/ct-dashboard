<div class="admin-shell theme-purple"
     [class.ls-closed]="isMobile()"
     [class.overlay-open]="isMobile() && sidenavOpened()"
     [class.side-closed]="!isMobile() && !sidenavOpened()"
     [class.submenu-closed]="!isMobile() && !sidenavOpened()">

  <!-- ═══ Topbar Kuber ═══ -->
  <nav class="navbar active">
    <div class="container-fluid">
      <div class="navbar-header">
        <a href="#" onclick="return false;" class="bars" (click)="onToggleSidenav()"></a>
        <a class="navbar-brand" routerLink="/admin/dashboard">
          <img src="/hm_dev_logo.png" alt="HM-Events" class="brand-logo" />
          <span class="logo-name">HM Events</span>
        </a>
      </div>
      <div class="collapse navbar-collapse show">
        <ul class="float-start collapse-menu-icon">
          <li class="collapseBtn">
            <button mat-icon-button (click)="onToggleSidenav()" class="sidemenu-collapse nav-notification-icons">
              <mat-icon class="icon-color">menu</mat-icon>
            </button>
          </li>
        </ul>
        <ul class="nav navbar-nav navbar-right">
          <li class="fullscreen">
            <a mat-icon-button routerLink="/" class="nav-notification-icons" matTooltip="Voir le site">
              <mat-icon class="icon-color">home</mat-icon>
            </a>
          </li>
          <li class="nav-item user_profile">
            <button mat-button [matMenuTriggerFor]="profilemenu">
              <div class="chip">
                <span>{{ displayName() || userEmail()?.email }}</span>
                <span class="user-avatar">{{ initials() }}</span>
              </div>
            </button>
            <mat-menu #profilemenu="matMenu" class="profile-menu">
              <button mat-menu-item routerLink="/admin/settings">
                <mat-icon>settings</mat-icon>
                Paramètres
              </button>
              <button mat-menu-item (click)="onLogout()">
                <mat-icon>logout</mat-icon>
                Déconnexion
              </button>
            </mat-menu>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ═══ Sidebar Kuber ═══ -->
  <aside id="leftsidebar" class="sidebar">
    <div class="menu">
      <div class="sidebar-scroll">
        <ul class="list">
          <li class="sidebar-user-panel">
            <div class="user-panel">
              <div class="image">
                <span class="user-avatar user-avatar-lg">{{ initials() }}</span>
              </div>
            </div>
            <div class="profile-usertitle">
              <div class="sidebar-userpic-name">{{ displayName() || 'Admin' }}</div>
              <div class="profile-usertitle-job">HM-Events</div>
            </div>
          </li>

          <li class="header">NAVIGATION</li>
          @for (item of navItems; track item.path) {
            <li routerLinkActive="active-top">
              <a [routerLink]="item.path" class="menu-top">
                <mat-icon class="sidebarIcon">{{ item.icon }}</mat-icon>
                <span class="hide-menu">{{ item.label }}</span>
              </a>
            </li>
          }

          <li class="header">SITE</li>
          <li>
            <a routerLink="/" class="menu-top">
              <mat-icon class="sidebarIcon">home</mat-icon>
              <span class="hide-menu">Voir le site</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </aside>

  @if (isMobile() && sidenavOpened()) {
    <div class="mobile-overlay" (click)="sidenavOpened.set(false)"></div>
  }

  <!-- ═══ Contenu ═══ -->
  <section class="content">
    <router-outlet />
  </section>
</div>
