<div class="admin-layout">
  <mat-toolbar color="primary" class="admin-toolbar">
    <button mat-icon-button (click)="onToggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-icon class="toolbar-logo">track_changes</mat-icon>
    <span class="toolbar-title">CT Tracker</span>
    <span class="spacer"></span>
    <span class="user-email">{{ userEmail()?.email }}</span>
    <button mat-icon-button (click)="onLogout()" matTooltip="Déconnexion">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav [opened]="sidenavOpened()" mode="side" class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/admin/events" routerLinkActive="active-link">
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle>Événements</span>
        </a>
      </mat-nav-list>

      <div class="sidenav-footer">
        <a mat-list-item routerLink="/" class="home-link">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Voir le site</span>
        </a>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
